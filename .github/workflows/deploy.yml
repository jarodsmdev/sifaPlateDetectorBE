name: Build and Deploy Plate Service

on:
  push:
    branches:
      - prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Export secrets from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          doppler secrets download \
            --no-file \
            --format json | jq -r '
              to_entries[]
              | "\(.key)<<EOF\n\(.value)\nEOF"
            ' >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t jarodsm/sifa-plate:latest .

      - name: Push Docker image
        run: |
          docker push jarodsm/sifa-plate:latest

      - name: Generate runtime env
        run: |
          cat > plate.env <<EOF
          OMP_NUM_THREADS=2
          OPENBLAS_NUM_THREADS=2
          MKL_NUM_THREADS=2
          PYTHONUNBUFFERED=1
          EOF

      - name: Create SSH key
        run: |
          echo "${EC2_SSH_KEY}" > key.pem
          chmod 600 key.pem

      - name: Copy env file to private EC2
        run: |
          scp \
            -i key.pem \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ProxyCommand="ssh -i key.pem -W %h:%p -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ubuntu@${EC2_HOST}" \
            plate.env \
            ubuntu@${PLATE_PRIVATE_HOST}:/tmp/plate.env

      - name: Deploy Plate Service
        run: |
          ssh \
            -i key.pem \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ProxyCommand="ssh -i key.pem -W %h:%p -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ubuntu@${EC2_HOST}" \
            ubuntu@${PLATE_PRIVATE_HOST} << 'EOF'

              set -e

              echo "Pulling latest image..."
              docker pull jarodsm/sifa-plate:latest

              echo "Stopping old container..."
              docker rm -f sifa-plate || true

              echo "Starting new container..."

              docker run -d \
                --name sifa-plate \
                -p 80:8000 \
                --restart unless-stopped \
                -v /home/ubuntu/data:/data \
                -v /home/ubuntu/paddle_cache:/root/.paddleocr \
                -v /home/ubuntu/yolo_cache:/root/.cache/open-image-models \
                --env-file /tmp/plate.env \
                -e OMP_NUM_THREADS=2 \
                -e OPENBLAS_NUM_THREADS=2 \
                -e MKL_NUM_THREADS=2 \
                jarodsm/sifa-plate:latest

              echo "Deployment completed successfully."
          EOF

      - name: Cleanup
        run: |
          rm -f key.pem
          rm -f plate.env