name: Build and Deploy Plate Service

on:
  push:
    branches:
      - prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Export secrets from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          doppler secrets download \
            --no-file \
            --format json | jq -r '
              to_entries[]
              | "\(.key)<<EOF\n\(.value)\nEOF"
            ' >> $GITHUB_ENV

      # Falla rápido si faltan secretos en Doppler: el servicio no puede
      # arrancar sin ellos (auth_config._require_env y ChannelKeyMiddleware).
      - name: Verify required secrets
        run: |
          missing=0
          for v in JWT_SECRET JWT_ISSUER JWT_AUDIENCE INTERNAL_CHANNEL_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::Falta el secreto '$v' en Doppler"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t jarodsm/sifa-plate:latest .

      - name: Push Docker image
        run: |
          docker push jarodsm/sifa-plate:latest

      - name: Generate runtime env
        run: |
          cat > plate.env <<EOF
          OMP_NUM_THREADS=2
          OPENBLAS_NUM_THREADS=2
          MKL_NUM_THREADS=2
          PYTHONUNBUFFERED=1

          JWT_SECRET=${JWT_SECRET}
          JWT_ISSUER=${JWT_ISSUER}
          JWT_AUDIENCE=${JWT_AUDIENCE}
          # Firma del canal interno exigida por ChannelKeyMiddleware
          INTERNAL_CHANNEL_KEY=${INTERNAL_CHANNEL_KEY}
          EOF

      - name: Create SSH key
        run: |
          echo "${EC2_SSH_KEY}" > key.pem
          chmod 600 key.pem

      - name: Copy env file to private EC2
        run: |
          scp \
            -i key.pem \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ProxyCommand="ssh -i key.pem -W %h:%p -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ubuntu@${EC2_HOST}" \
            plate.env \
            ubuntu@${PLATE_PRIVATE_HOST}:/tmp/plate.env

      - name: Deploy Plate Service
        run: |
          ssh \
            -i key.pem \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ProxyCommand="ssh -i key.pem -W %h:%p -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ubuntu@${EC2_HOST}" \
            ubuntu@${PLATE_PRIVATE_HOST} << 'EOF'

              set -e

              trap "rm -f /tmp/plate.env" EXIT

              echo "Pulling latest image..."
              docker pull jarodsm/sifa-plate:latest

              echo "Stopping old container..."
              docker rm -f sifa-plate || true

              echo "Starting new container..."

              docker run -d \
                --name sifa-plate \
                -p 10.0.2.20:80:8000 \
                --restart unless-stopped \
                -v /home/ubuntu/data:/data \
                -v /home/ubuntu/paddle_cache:/root/.paddleocr \
                -v /home/ubuntu/yolo_cache:/root/.cache/open-image-models \
                --env-file /tmp/plate.env \
                jarodsm/sifa-plate:latest

              echo "Verifying deployment..."
              code=000
              for i in $(seq 1 18); do
                sleep 10
                code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 \
                  http://10.0.2.20/ 2>/dev/null || true)
                if [ -n "$code" ] && [ "$code" != "000" ]; then
                  break
                fi
              done

              if [ -z "$code" ] || [ "$code" = "000" ]; then
                echo "::error::El servicio plate no responde en 10.0.2.20:80"
                docker logs --tail 100 sifa-plate 2>&1 || true
                exit 1
              fi

              echo "Plate responde con HTTP $code"
          EOF

      - name: Cleanup
        run: |
          rm -f key.pem
          rm -f plate.env