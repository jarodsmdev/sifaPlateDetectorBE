services:
  plate-api:
    build: .
    container_name: plate-api
    ports:
      # Publicado solo en loopback: en producción el tráfico llega por la IP
      # privada (ver deploy_SIFA-PLATE.sh), no por todas las interfaces.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
      - ./paddle_cache:/root/.paddleocr
      - ./yolo_cache:/root/.cache/open-image-models
    environment:
      - PYTHONUNBUFFERED=1
      # Límites de concurrencia para evitar estrangular la CPU en la instancia EC2
      - OMP_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      # JWT Configuration - autenticación y autorización
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      # Firma del canal interno exigida por ChannelKeyMiddleware
      - INTERNAL_CHANNEL_KEY=${INTERNAL_CHANNEL_KEY:-}
    restart: unless-stopped
    networks:
      - sifa-network # Usar red externa

networks:
  sifa-network:
    external: true #  Indicar que es externa
