services:
  plate-api:
    build: .
    container_name: plate-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./paddle_cache:/root/.paddleocr
      - ./yolo_cache:/root/.cache/open-image-models
    environment:
      - PYTHONUNBUFFERED=1
      # Límites de concurrencia para evitar estrangular la CPU en la instancia EC2
      - OMP_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      # JWT Configuration - autenticación y autorización
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
    restart: unless-stopped
    networks:
      - sifa-network # Usar red externa

networks:
  sifa-network:
    external: true #  Indicar que es externa
