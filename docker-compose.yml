services:
  plate-api:
    build: .
    container_name: license-plate-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./paddle_cache:/root/.paddleocr
      - ./yolo_cache:/root/.cache/open-image-models
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - plate-network

networks:
  plate-network:
    name: plate-network
    driver: bridge
